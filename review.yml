- date: '2026-09-01'
  rating: 4
  summary: 'Re-profiled under the API Evangelist university pipeline. The 2026-06-03 review understated
    this institution materially and is corrected here rather than confirmed. Tongji University operates
    a real, institution-engineered API platform at api.tongji.edu.cn — its own registrable domain, resolving
    into CERNET-CN (China Education and Research Network) address space, fronted by a KrakenD 2.4.2 gateway
    with its own Keycloak authorization server. Three corrections. First, openly callable public endpoints
    DO exist: thirteen reference-metadata interfaces are documented as 无需授权可直接访问 and every one of them
    returned HTTP 200 application/json to an unauthenticated GET on 2026-09-01, 730 code-table rows in
    total. Second, the platform publishes a live OpenID Connect discovery document listing 491 named OAuth
    scopes, roughly one per interface — the most granular published scope design seen in this cohort.
    Third, the university runs its own Shibboleth SAML 2.0 identity provider, registered into eduGAIN
    by CARSI since 2020-02-22, which the June profile missed entirely. Forty-three interface documentation
    pages were fetched and 42 modelled into a derived OpenAPI with per-tag splits. The deep-doc 404s the
    June review recorded were an artefact of guessing SPA routes; the real routes recovered from the rendered
    navigation all resolve 200. Genuine gaps remain and are recorded: no published spec of any kind, no
    sitemap, no robots.txt, no llms.txt, no changelog, no deprecation policy, no rate-limit response headers,
    an empty zero-length body on 401, no OAI-PMH, no institutional repository, no open-data portal, and
    no DataCite or Crossref membership. github.com/Tongji-University exists but is empty and unnamed,
    so no GitHub organization is claimed. Documentation is Chinese-only. Nothing was fabricated and every
    artifact carries its method and source.'
  endpoints:
