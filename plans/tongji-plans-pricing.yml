description: 'Tongji University is a non-commercial higher-education institution and its Open Platform
  is not sold. There is no price on any tier and no commercial plan of any kind. Access is granted by
  institutional standing, not by payment: thirteen reference-metadata interfaces are open to anyone with
  no credential and no registration, and every other interface requires a faculty or student application
  to the Information Office, approved per application, which issues a client_id, a client_secret and a
  fixed set of OAuth scopes.'
notes: No per-seat, per-call or tiered commercial pricing exists. "Free / Open" reflects the thirteen
  anonymously callable interfaces confirmed live on 2026-09-01. "Institutional application" reflects everything
  else, which is gated on affiliation and approval rather than on money. Higher rate limits are also granted
  by request rather than purchase.
