    get:
      operationId: v2_dc_research_longitudinal_project_for_PD
      summary: Research project records
      description: '根据学工号查询以第一申请人申请科研项目情况 Original documented title: 科研项目信息. Upstream system of record declared by the platform: SYS20230147(科研大平台),SYS20230025(同济大学人事系统). Authorization modes declared by the platform: 客户端模式,授权码模式. Documentation last updated: 2026年06月09日 09时21分04秒.'
