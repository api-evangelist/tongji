openapi: 3.2.0
info:
  title: Tongji University Open Platform Research API
  version: '2026-09-01'
  summary: Institution-operated campus data and capability API platform run by the Tongji University Information Office.
  description: The Tongji University Open Platform (同济大学开放平台) is operated by the university itself at api.tongji.edu.cn, on China Education and Research Network (CERNET) address space, and exposes campus data and shared capability interfaces to faculty, students and campus applications.
  contact:
    name: Tongji University Information Office — Open Platform
    url: https://api.tongji.edu.cn/docs/intro/apply/contact_us
  x-provenance:
    generated: '2026-09-01'
    method: derived
    source: https://api.tongji.edu.cn/docs — 43 published interface documentation pages fetched 2026-09-01 (HTTP 200), plus live probes of the 13 anonymous interfaces.
    x-operator: institution
servers:
- url: https://api.tongji.edu.cn
  description: Tongji University Open Platform production host (CERNET, 202.120.182.237).
security:
- openPlatformOAuth: []
tags:
- name: Research
  description: Patent, software-copyright, project, funding, award, publication and monograph records from the university research-management systems.
paths:
  /v1/rt/research/patent:
    get:
      operationId: v1_rt_research_patent
      summary: Research patent records (real time)
      description: '根据学工号或专利号查询科研专利情况 Original documented title: 科研专利信息-实时. Upstream system of record declared by the platform: SYS20230146(专利管理系统). Authorization modes declared by the platform: 客户端模式,授权码模式. Documentation last updated: 2026年06月09日 08时46分14秒.'
      tags:
      - Research
      externalDocs:
        description: Tongji University Open Platform interface documentation (Chinese)
        url: https://api.tongji.edu.cn/docs/interface/research/v1_rt_research_patent
      parameters:
      - name: userId
        in: query
        required: false
        description: 学工号
        schema:
          type: string
      - name: appNo
        in: query
        required: false
        description: 专利号
        schema:
          type: string
      responses:
        '200':
          description: Success. Envelope code A00000.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        infos:
                          type: array
                          items:
                            $ref: '#/components/schemas/V1RtResearchPatentItem'
                        count:
                          type: integer
                          description: Total number of records matched.
        '401':
          description: access_token missing, expired or invalid.
        '403':
          description: The token scope does not cover this interface.
        '429':
          description: Rate limit exceeded (default 50 requests per second per application per IP).
  /v1/rt/research/software_works:
    get:
      operationId: v1_rt_research_software_works
      summary: Software copyright registration records (real time)
      description: '根据软件著作登记号查询软件著作权相关信息 Original documented title: 软件著作权信息-实时. Upstream system of record declared by the platform: SYS20230146(专利管理系统). Authorization modes declared by the platform: 客户端模式,授权码模式. Documentation last updated: 2026年06月09日 09时34分33秒.'
