  - aid: tongji:ror
    name: ROR Organization Registration
    description: >-
      Tongji University is registered in the Research Organization Registry with ROR ID
      https://ror.org/03rc6as71 (同济大学, Shanghai, China). This is a registry membership, not a
      contract the university publishes — the ROR API belongs to ROR. It is recorded because being
      registered is a fact about the institution and is how machine agents resolve it. Four related
      Tongji-named entities are separately registered (Shanghai East Hospital, Tongji Hospital,
      Yangpu Hospital, Tongji Zhejiang College) and are distinct organizations, not this one.
      Tongji is NOT a DataCite member and NOT a Crossref member — both registries return zero
      matches.
    humanURL: https://ror.org/03rc6as71
    baseURL: https://api.ror.org/v2/organizations/03rc6as71
    x-operator: registry
    x-operator-evidence: >-
