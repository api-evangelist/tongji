apis:
  - aid: tongji:open-platform
    name: Tongji University Open Platform
    description: >-
      The university's own institutional data and capability API platform, operated by the Tongji
      University Information Office. Roughly 234 documented interfaces across fifteen families:
      personnel, student, teacher, teaching management, research, school management, library,
      campus-card and access control, asset and procurement, education-data verification, AI
      services, notifications, calendar, cloud meeting and electronic signature. Routes carry a
      version segment (/v1/, /v2/) and a delivery-mode segment — `rt` for real-time queries against
      the system of record, `dc` for warehouse-served batch data, `infra` for shared campus
      capabilities, `metadata` for reference code tables. Interfaces are called with an OAuth 2.0
      bearer token from the platform's Keycloak realm under either client-credentials or
      authorization-code mode; thirteen reference-metadata interfaces need no credential at all and
      were confirmed callable on 2026-09-01. Rate limiting is a documented token bucket at 50
      requests per second per application per IP, with 429 on exhaustion. Notably, every interface
      page names the upstream system of record it draws from — a provenance practice most
      university platforms do not have.
    humanURL: https://api.tongji.edu.cn/docs
    baseURL: https://api.tongji.edu.cn
    x-operator: institution
    x-operator-evidence: >-
      api.tongji.edu.cn is under Tongji University's own registrable domain and resolves to
      202.120.182.237 in CERNET-CN (China Education and Research Network), the national academic
      network — no vendor CNAME, no shared SaaS host. The authorization server is a Keycloak realm
      the university runs itself at api.tongji.edu.cn/keycloak/realms/OpenPlatform, whose issuer is
      its own domain. Probed 2026-09-01: /docs 200, /keycloak/realms/OpenPlatform/.well-known/openid-configuration
      200 application/json, /v1/metadata/user/sex_code 200 application/json unauthenticated,
      /v1/rt/research/patent 401 unauthenticated, /v1/token 405 on GET.
