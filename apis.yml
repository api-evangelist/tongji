x-coverage:
  state: covered
  reason: covered
  detail: >-
    Tongji University is one of the few institutions in this cohort with a substantial, genuinely
    institution-operated API surface, and this run corrected the profile UPWARD rather than
    downward. The 2026-06-03 profile recorded the Open Platform as documentation-only with "no
    openly callable public endpoints confirmed" and no artifacts at all; that was wrong. Thirteen
    reference-metadata interfaces are documented as 无需授权可直接访问 and were confirmed anonymously
    callable on 2026-09-01, returning HTTP 200 application/json with 730 live code-table rows in
    total. A live OpenID Connect discovery document publishes 491 named OAuth scopes. Forty-three
    interface documentation pages were fetched and 42 modelled into a derived OpenAPI. The
    university's Shibboleth IdP was found registered in eduGAIN through CARSI — a class of surface
    this cohort was almost entirely missing.

    What is genuinely absent, and stays recorded as absent: Tongji publishes no machine-readable
    contract of its own (/swagger.json, /v3/api-docs, /.well-known/openapi.json all 404), no
    sitemap.xml, no robots.txt, no llms.txt, no changelog and no deprecation policy. There is no
    institutional repository, no OAI-PMH endpoint (www.lib.tongji.edu.cn/oai 404), no open-data
    portal (data.tongji.edu.cn does not resolve), no DataCite or Crossref membership, and no
    verifiable official GitHub organization — github.com/Tongji-University exists but is empty,
    unnamed and undescribed, so it is not claimed. Every OpenAPI in openapi/ is API Evangelist's
    derivation from Tongji's own Chinese documentation and is marked as such.

    Two things this profile deliberately does NOT claim. The platform's
    /docs/intro/other/policies page is a privacy-policy TEMPLATE the Information Office hands to
    campus application developers, full of xxxx placeholders — it is not the university's own
    privacy policy and is not recorded as one. And the modelled OpenAPI covers 42 of roughly 234
    documented interfaces; the personnel, student, teaching-management and campus-card families
    were left unmodelled rather than harvested at scale, because they describe person-level records
    and the code tables and research/library/asset families were enough to establish the contract's
    shape honestly.
