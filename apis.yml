aid: tongji
name: Tongji University
description: >-
  Tongji University (同济大学) is a public research university in Shanghai, China, in the national
  Double First-Class programme and ranked around #192 in the QS World University Rankings. Unlike
  most of the university cohort, its programmable footprint is real and it is the university's own
  engineering, not a vendor's: the Tongji University Information Office operates an institutional
  Open Platform at api.tongji.edu.cn — on China Education and Research Network address space, behind
  a KrakenD gateway, with its own Keycloak authorization server — publishing roughly 234 documented
  interfaces across fifteen families covering personnel, student, teaching, research, campus-card,
  library, asset, procurement, education-data verification, AI and notification services. Its OpenID
  Connect discovery document is live and lists 491 named OAuth scopes, one per interface for most of
  the catalog. Thirteen reference-metadata interfaces are documented as requiring no authorization
  and were confirmed anonymously callable, returning live JSON code tables; everything else is gated
  behind a faculty or student application-and-approval process. The university also runs its own
  Shibboleth SAML 2.0 identity provider, registered into eduGAIN through CARSI, China's national
  research-and-education identity federation. What it does not have is a published contract: no
  OpenAPI, Swagger, Postman collection, sitemap, robots.txt, llms.txt or changelog is served
  anywhere on the platform, all documentation is Chinese-only, and there is no institutional
  repository, OAI-PMH endpoint, open-data portal, DataCite or Crossref membership. Every OpenAPI in
  this repo is API Evangelist's derivation from Tongji's published documentation, not a Tongji
  artifact.
