  - aid: tongji:identity-provider
    name: Tongji University Shibboleth Identity Provider (CARSI / eduGAIN)
    description: >-
      Tongji University's own SAML 2.0 identity provider, registered into eduGAIN by CARSI, the
      CERNET Authentication and Resource Sharing Infrastructure — China's national research and
      education identity federation, an eduGAIN member since 2019 and in production interfederation
      since 2019-06-18. Tongji's entity has been in the eduGAIN aggregate since 2020-02-22, carries
      both IDPSSODescriptor and AttributeAuthorityDescriptor roles, and asserts scope
      tongji.edu.cn. This is a machine-readable, institution-operated identity surface and it is
      the strongest education-regime conformance evidence in the repo. Caveat recorded honestly in
      the artifact: the copy served at the IdP's own /idp/shibboleth location is Shibboleth's stock
      self-generated example metadata with an expired 2020 validUntil; the authoritative signed
      copy is the one CARSI publishes into eduGAIN.
    humanURL: https://www.carsi.edu.cn/
    baseURL: https://idp2.tongji.edu.cn/idp
    x-operator: federation
    x-operator-evidence: >-
      A federation is shared by definition and the IdP behind it is the institution's.
      idp2.tongji.edu.cn is under Tongji's own registrable domain and resolves to 202.120.188.209
      in CERNET-CN with no vendor CNAME in front of it. Probed 2026-09-01:
      https://idp2.tongji.edu.cn/idp/shibboleth 200 application/xml 14,592 bytes;
      https://technical.edugain.org/api.php?action=list_entities&format=json 200 returns entity
      671755 entityID https://idp2.tongji.edu.cn/idp/shibboleth registered by
      https://www.carsi.edu.cn.
