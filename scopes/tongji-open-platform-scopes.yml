summary:
  total_scopes_published: 491
  oidc_standard_scopes: 7
  platform_scopes: 484
  granularity: per-interface
  assignment: Scopes are bound to a client_id by the Information Office through the application-and-approval
    process; they are not self-service and cannot be requested dynamically.
  enforcement: A token whose scope set does not cover the called interface returns HTTP 403 even when
    the client_id is valid.
description: 'Tongji University''s Open Platform publishes 491 OAuth scopes in its own OIDC discovery
  document — one scope per interface for most of the catalog, plus a smaller set of coarse resource-family
  scopes. This is unusually fine-grained scope design for a university-operated platform and it is machine-readable,
  which is why it is recorded here from the discovery document rather than from prose. The naming convention
  mirrors the route: scope `rt_research_patent` unlocks GET /v1/rt/research/patent, and scope `user_api`
  unlocks the /v1/rt/user/ prefix.'
oidc_standard:
- email
- microprofile-jwt
- offline_access
- openid
- profile
- roles
- web-origins
