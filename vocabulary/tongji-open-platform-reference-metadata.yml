vocabulary:
  name: Tongji University Open Platform Reference Metadata
  description: 'The Open Platform publishes its own controlled vocabularies as callable code tables under
    /v1/metadata/ and /v2/metadata/, with no credential required. These are the code sets every other
    interface on the platform encodes against — gender, identity-document type, staff category and status,
    professional title and post grade, dormitory building and region, campus gate, meeting room. Publishing
    the code tables openly while gating the records they describe is a deliberate and unusually good piece
    of design for a university platform: an integrator can build and validate against the vocabulary before
    an access request is approved. The nine personnel code lists are drawn from the university human-resources
    system (SYS20230025) per the platform documentation.'
