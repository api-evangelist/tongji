x-operator: federation
operator_basis: >-
  A federation is shared by definition and the identity provider behind it is the institution's.
  idp2.tongji.edu.cn is under Tongji University's own registrable domain and resolves to
  202.120.188.209 in CERNET-CN, the China Education and Research Network — the national academic
  network, not a commercial hosting vendor. No vendor CNAME sits in front of it. This is a
  Tongji-operated Shibboleth deployment registered into a national federation by CARSI, and it is
  the single strongest institution-operated machine-readable surface in this repo after the Open
  Platform itself.
description: >-
  Tongji University runs its own Shibboleth SAML 2.0 identity provider and is a registered member
  of CARSI (CERNET Authentication and Resource Sharing Infrastructure), China's national research
  and education identity federation, which has been an eduGAIN member since 2019-05-24 and in
  production interfederation since 2019-06-18. Tongji's entity has been visible in the eduGAIN
  metadata aggregate since 2020-02-22.

  One honest caveat, which is a finding rather than a defect in the record: the metadata document
  served at the IdP's own canonical /idp/shibboleth location is the Shibboleth software's
  self-generated example metadata — it carries the stock "This is example metadata only" comment,
  an unfilled mdui:UIInfo block, and a validUntil of 2020-02-21 that has long since passed. That
  file is a Shibboleth installation artifact, not the university's published federation metadata.
  The authoritative, signed, current metadata for this entity is the copy CARSI publishes into the
  eduGAIN aggregate, where the display names, scope and role descriptors are all populated. Read
  the local file as evidence that Tongji operates the IdP, and the eduGAIN record as evidence of
  what it federates.
